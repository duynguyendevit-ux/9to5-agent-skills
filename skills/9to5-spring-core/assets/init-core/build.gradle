plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.3'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'tech.app'
version = '0.0.1-SNAPSHOT'
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}
repositories {
    mavenCentral()
    def repositoryUrl = System.getenv('MAVEN_REPOSITORY_URL')
    if (repositoryUrl) {
        maven {
            url = uri(repositoryUrl)
            credentials {
                username = System.getenv('MAVEN_REPOSITORY_USERNAME')
                password = System.getenv('MAVEN_REPOSITORY_PASSWORD')
            }
        }
    }
}
dependencyManagement {
    imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2022.0.4' }
}
dependencies {
    implementation "tech.outsource:microservice-spring-boot-starter:${MICROSERVICE_STARTER_VERSION}"
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters'
}
